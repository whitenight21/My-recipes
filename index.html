<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradičné & Moderné Recepty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #D9532F;
      --primary-hover: #BF411F;
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text-main: #2A2421;
      --text-muted: #786C66;
      --border: #EFEAE4;
      --shadow-sm: 0 4px 20px rgba(42, 36, 33, 0.05);
      --shadow-lg: 0 12px 30px rgba(42, 36, 33, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 100px;
    }

    /* Centered Header & Navigation */
    header {
      text-align: center;
      padding: 60px 20px 40px;
      max-width: 800px;
      margin: 0 auto;
      scroll-margin-top: 50px;
    }

    header .badge {
      display: inline-block;
      background: #F8EFEA;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 6px 16px;
      border-radius: 30px;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 3.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    header p {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .meal-nav {
      display: inline-flex;
      background: #FFF;
      padding: 6px;
      border-radius: 40px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .meal-nav a {
      text-decoration: none;
      color: var(--text-main);
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .meal-nav a:hover {
      background: var(--primary);
      color: #FFF;
      box-shadow: 0 4px 12px rgba(217, 83, 47, 0.25);
    }

    /* Main Container & Sections */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .meal-section {
      margin-top: 70px;
      scroll-margin-top: 30px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-header h2 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .btn-surprise {
      background: #FFF;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      padding: 10px 20px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .btn-surprise:hover {
      background: var(--primary);
      color: #FFF;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(217, 83, 47, 0.3);
    }

    .category-banner {
      width: 100%;
      height: 220px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 32px;
      box-shadow: var(--shadow-sm);
    }

    .category-banner img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* Recipe Cards */
    .recipe-card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 32px;
      margin-bottom: 36px;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .recipe-card:hover {
      box-shadow: var(--shadow-lg);
    }

    .recipe-card.highlight {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(217, 83, 47, 0.25), var(--shadow-lg);
      transform: translateY(-2px);
    }

    .recipe-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .recipe-subtitle {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .recipe-meta-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .recipe-meta {
      display: inline-flex;
      align-items: center;
      background: #F8EFEA;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .recipe-image-wrap {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .recipe-image {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .recipe-card:hover .recipe-image {
      transform: scale(1.02);
    }

    .recipe-details h4 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 22px 0 10px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .recipe-details ul, .recipe-details ol {
      padding-left: 22px;
    }

    .recipe-details li {
      margin-bottom: 8px;
      color: var(--text-main);
      font-weight: 500;
    }

    /* Back to Top Button Footer inside Card */
    .card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .btn-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      background: #F8EFEA;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .btn-top:hover {
      background: var(--primary);
      color: #FFF;
      transform: translateY(-2px);
    }
  </style>
</head>

    <nav class="meal-nav">
      <a href="#raňajky">Raňajky</a>
      <a href="#obed">Obed</a>
      <a href="#večera">Večera</a>

  </header>

  <main>

      </div>

    </section>

    <!-- Obed Section -->

      </div>

        <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=1000" alt="Obed Banner">
      </div>
      <div id="obed-container"></div>
    </section>

    <!-- Večera Section -->

      </div>
      <div id="večera-container"></div>
    </section>
  </main>

    // Render Recipes into matched categories
    function renderAll() {
      ['raňajky', 'obed', 'večera'].forEach(cat => {
        const container = document.getElementById(`${cat}-container`);
        container.innerHTML = '';
        
        const catRecipes = recipes.filter(r => r.category === cat);
        catRecipes.forEach(recipe => {
          container.appendChild(createRecipeCard(recipe));
        });
      });
    }

    // Generate HTML Card Component with Back to Top button
    function createRecipeCard(recipe) {
      const card = document.createElement('article');
      card.className = 'recipe-card';
      card.id = `card-${recipe.id}`;

      card.innerHTML = `
        <h3 class="recipe-title">${recipe.title}</h3>
        ${recipe.subtitle ? `<div class="recipe-subtitle">${recipe.subtitle}</div>` : ''}
        <div class="recipe-meta-group">
          <div class="recipe-meta">⏱ Čas prípravy: ${recipe.prepTime}</div>
          ${recipe.servings ? `<div class="recipe-meta">🍽 ${recipe.servings}</div>` : ''}
        </div>
        <div class="recipe-image-wrap">
          <img class="recipe-image" src="${recipe.image}" alt="${recipe.title}">
        </div>
        <div class="recipe-details">
          <h4>Suroviny</h4>
          <ul>${recipe.ingredients.map(item => `<li>${item}</li>`).join('')}</ul>
          <h4>Postup</h4>
          <ol>${recipe.instructions.map(step => `<li>${step}</li>`).join('')}</ol>
        </div>
        <div class="card-footer">
          <a href="#top" class="btn-top">↑ Na začiatok</a>
        </div>
      `;
      return card;
    }

    // Section-scoped Surprise Me logic
    function surpriseMe(category) {
      const available = recipes.filter(r => r.category === category);
      if (available.length === 0) return alert('V tejto sekcii zatiaľ nie sú žiadne recepty!');

      const randomRecipe = available[Math.floor(Math.random() * available.length)];
      const element = document.getElementById(`card-${randomRecipe.id}`);

      if (element) {
        element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        element.classList.add('highlight');
        setTimeout(() => element.classList.remove('highlight'), 2000);
      }
    }

    // Initialize
    renderAll();
  </script>
